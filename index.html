<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F7F7F5" />
    <!-- Pick the theme before the first paint so dark-mode visitors never see a
         light flash: saved choice first, otherwise the system setting. (See useTheme.) -->
    <script>
      (function () {
        var theme
        try {
          theme = localStorage.getItem('theme')
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
        if (theme === 'dark') {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#111110')
        }
      })()
    </script>
    <meta name="description" content="Software engineer based in Davao, Philippines. Open to remote roles." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts (design.md §6): Geist + Geist Mono for the quiet site.
         Not loaded yet because nothing uses them: Pixelify Sans (loud doors)
         and Mrs Saint Delafield (signature). When you build those, add
         &family=Pixelify+Sans:wght@500;600;700&family=Mrs+Saint+Delafield
         to the URL below. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
    />

    <title>Portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
