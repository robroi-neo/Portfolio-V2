<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- "R." in the same single-stroke script as the footer signature. Light tab: dark ink on
       cream; dark tab: cream ink on dark (browsers that ignore the media query show the light one). -->
  <style>
    .bg { fill: #f7f7f5; stroke: #1a1a1a; stroke-opacity: 0.12; }
    .ink { fill: none; stroke: #1a1a1a; stroke-linecap: round; stroke-linejoin: round; }
    .dot { fill: #1a1a1a; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1a1a1a; stroke: #f7f7f5; stroke-opacity: 0.18; }
      .ink { stroke: #f7f7f5; }
      .dot { fill: #f7f7f5; }
    }
  </style>
  <rect class="bg" x="1" y="1" width="62" height="62" rx="14" stroke-width="1.5"/>
  <!-- Letters are drawn in the font's own units; scaled to fit and centered. -->
  <g class="ink" stroke-width="5.5" transform="translate(32 32) scale(0.6) translate(-56.7 -46.9)">
    <path d="M44.1 20.2L47.2 23.3L47.2 32.8L44.1 45.4L41 54.8L37.8 61.1L31.5 70.5L25.2 76.9L18.9 80L15.8 80L12.6 76.9L12.6 67.4L15.8 51.6L18.9 42.2L22 35.9L28.4 26.4L34.6 20.2L41 17L50.4 13.8L63 13.8L69.3 17L72.4 20.2L75.6 26.4L75.6 35.9L72.4 42.2L69.3 45.4L63 48.5L53.6 48.5L44.1 45.4L47.2 48.5L50.4 54.8L50.4 70.5L53.6 76.9L59.8 80L66.2 76.9L69.3 73.7L75.6 64.2"/>
    <path class="dot" d="M97.7 73.7L94.6 76.9L97.7 80L100.8 76.9L97.7 73.7"/>
  </g>
</svg>
