<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Simplified mixtape cassette (same colors as the music card), sized to stay readable at 16–32px. -->
  <!-- Shell, with a light edge so it shows on dark browser tabs -->
  <rect x="2" y="12" width="60" height="40" rx="6" fill="#1c1c1c" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5"/>
  <!-- Label -->
  <rect x="7" y="16" width="50" height="23" rx="2.5" fill="#f2ecdf"/>
  <!-- Red stripe + gold band -->
  <rect x="7" y="22" width="50" height="3.5" fill="#d9472b"/>
  <rect x="7" y="30" width="50" height="9" fill="#c9a86a"/>
  <!-- Tape window -->
  <rect x="16" y="24" width="32" height="13" rx="6.5" fill="#1c1c1c"/>
  <!-- Reels -->
  <circle cx="24" cy="30.5" r="4" fill="#f4f1ea"/>
  <circle cx="24" cy="30.5" r="1.6" fill="#1c1c1c"/>
  <circle cx="40" cy="30.5" r="4" fill="#f4f1ea"/>
  <circle cx="40" cy="30.5" r="1.6" fill="#1c1c1c"/>
  <!-- Bottom guard -->
  <path d="M17 52 L20 45 H44 L47 52 Z" fill="#2c2c2c"/>
</svg>
